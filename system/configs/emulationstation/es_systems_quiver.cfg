<?xml version="1.0" encoding="UTF-8"?>
<systemList>
	<system>
		<fullname>Quiver</fullname>
		<name>quiver</name>
		<manufacturer>quiver</manufacturer>
		<release>2026</release>
		<hardware>windows</hardware>
		<path>/userdata/roms/Quiver</path>
    	<extension>.quiver</extension>
    	<command>python /userdata/system/Quiver/configgen/run.py %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
		<platform>windows</platform>
		<theme>quiver</theme>
        <emulators>		
            <emulator name="quiver">
                <cores>
                    <core default="true">quiver</core>
                </cores>
            </emulator>		
        </emulators>
	</system>
</systemList>
